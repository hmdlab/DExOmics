name: dexomics

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.8
  - pip

  # Python scientific stack
  - numpy=1.24
  - pandas=2.0
  - scipy=1.10
  - scikit-learn=1.3
  - matplotlib
  - seaborn=0.13

  # R
  - r-base=4.4
  - r-tidyverse
  - r-data.table
  - r-ggpubr
  - r-pheatmap
  - r-reshape2
  - r-patchwork
  - r-broom
  - r-optparse
  - r-catools
  - r-hexbin

  # Bioconductor
  - bioconductor-summarizedexperiment
  - bioconductor-genomicfeatures
  - bioconductor-rtracklayer
  - bioconductor-plyranges
  - bioconductor-tcgabiolinks
  - bioconductor-complexheatmap

  - pip:
      - torch==1.13.0
      - shap==0.44.1